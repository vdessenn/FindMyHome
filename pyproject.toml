[project]
name = "findmyhome"
version = "0.1.0"
description = "Aggregates property listings from small estate agency websites into one digest email"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Dessenne", email = "83450047+vdessenn@users.noreply.github.com" }]
keywords = ["real-estate", "scraping", "sitemap", "email-digest", "python"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.30",
]

[project.scripts]
findmyhome = "findmyhome.__main__:main"

[project.urls]
Homepage = "https://github.com/vdessenn/FindMyHome"
Source = "https://github.com/vdessenn/FindMyHome"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

# Flat layout required by ARCHITECTURE.md (Source tree): the package sits at the root, not in src/.
[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "pyinstaller>=6.10",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff also formats code blocks inside Markdown: our docs are prose whose snippets are
# aligned by hand, so we keep ruff out of them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["findmyhome"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.mypy]
files = ["findmyhome", "tests"]
strict = true
